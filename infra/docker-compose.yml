version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rippleguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rippleguard
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: rippleguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rippleguard -d rippleguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: rippleguard-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://rippleguard:local_password@postgres:5432/rippleguard
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
